<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 - 财务综合事务平台 FISP</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#f0f2f5 0%,#e6f0fa 100%);font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif}
.card{background:#fff;border-radius:12px;padding:40px 36px;width:360px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.logo{text-align:center;margin-bottom:24px}
/* ===== 品牌字母标（2026-11-02 UI设计师）=====
   原为 📊 emoji 图标 → 改为 **FISP** 字母标（英文缩写）。
   理由：
     ① emoji 是彩色插画风，与「更显商务」的诉求相悖；
     ② 标题旁已有 FISP 徽标，图标位再放 emoji 会与整体品牌语言不统一；
     ③ 字母标可随品牌色走，更像正经的企业系统标识。
   做法：白字 + 品牌蓝底 + 加粗无衬线 + 收紧字距（letter-spacing 让 4 个字母更「实」）。
   字号/字重（2026-11-02 追加，用户要求「大一点、饱满一点」）：
     实测 15px/700 时文字只占 32px（方块 56px，左右各余 12px）→ 偏小、不够饱满。
     改为 **18px/800** → 文字占 41px（左右各余 7.5px）→ 饱满且留得住边距。
     ⚠️ 再大（19~20px）会只剩 6~5px 边距 → 显得挤、且不同字体渲染差异可能导致溢出。 */
.logo .icon{width:56px;height:56px;border-radius:10px;background:#1890ff;display:inline-flex;align-items:center;justify-content:center;margin-bottom:12px;
  color:#fff;font-size:18px;font-weight:800;letter-spacing:.5px;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  box-shadow:0 2px 6px rgba(24,144,255,.28)}
/* 标题：加字重 + 微字距 → 更有商务的稳重感（原来是常规字重的 20px） */
.logo h1{font-size:20px;color:#1f1f1f;font-weight:600;letter-spacing:.6px}
/* 品牌缩写徽标：~~跟在中文全名后面，小号浅色~~ 
   ⚠️ 2026-11-02 UI设计师：图标改为 FISP 字母标后，标题右侧的 FISP 徽标**已移除**
   （同一个缩写在同一屏出现两次 → 用户会以为有两个标识）。
   → 登录页标识区现在的分工：图标=FISP 缩写 / 标题=中文全称 / 英文行=英文全称。
   → 本条样式规则在登录页已无对应元素，保留供主界面 index.html 的同名写法参考
     （index.html 的标题旁仍有徽标，那里没有图标块，不重复）。 */
/* 英文全称行：加大字距 + 略提字号 → 全大写式的商务排版感 */
.logo .en{font-size:10.5px;color:#a3adc0;margin-top:6px;letter-spacing:1.1px;font-weight:500;text-transform:uppercase}
.logo p{font-size:12px;color:#7a88a0;margin-top:5px;letter-spacing:.4px}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;color:#8c8c8c;margin-bottom:6px;font-weight:500}
.field input{width:100%;padding:11px 14px;border:1px solid #d5dce6;border-radius:8px;font-size:14px;outline:none;transition:border-color .15s}
.field input:focus{border-color:#1890ff}
/* 密码框小眼睛 */
.pwd-wrap{position:relative}
.pwd-wrap input{padding-right:40px}
/* 小眼睛：固定 28×28 绝对定位于输入框内右侧。
   ⚠️ 必须显式写死宽高 —— 通用 button 样式（若带 width:100%）会把它撑满，
   整个盖在输入框上，导致「密码无法输入 + 显示错乱」。 */
.pwd-eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);
  width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;
  border:none;background:transparent;color:#7a88a0;cursor:pointer;
  font-size:15px;font-weight:normal;line-height:1;padding:0;opacity:.75;user-select:none}
.pwd-eye:hover{opacity:1;color:#1890ff}
.pwd-eye.on{opacity:1;color:#1890ff}
/* 锁定提示 */
.lock-box{margin-top:14px;padding:9px 12px;border-radius:8px;font-size:12.5px;line-height:1.6;
  background:#fff7e6;border:1px solid #ffd591;color:#ad6800}
.lock-box.err{background:#fff1f0;border-color:#ffa39e;color:#cf1322}
.lock-box b{font-variant-numeric:tabular-nums}
button{padding:12px;border:none;border-radius:8px;background:#1890ff;color:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:opacity .15s;
  letter-spacing:2px;font-family:inherit}
/* 登录按钮撑满；其他按钮（如小眼睛）由各自规则控制尺寸 */
#btn{width:100%}
/* 输入框/按钮统一继承页面字体 —— 否则各控件会用浏览器默认字体，
   与标题字体不一致（中文尤其明显），整体显得不专业。 */
.field input,.btn,.field input::placeholder{font-family:inherit}
button:hover{opacity:.9}
button:disabled{opacity:.5;cursor:not-allowed}
.msg{margin-top:14px;font-size:13px;text-align:center;color:#d63c3c;min-height:18px}
.hint{margin-top:18px;font-size:11.5px;color:#7a88a0;text-align:center;line-height:1.6}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="icon" aria-hidden="true">FISP</div>
    <h1>财务综合事务平台</h1>
    <p class="en">Financial Integrated Service Platform</p>
    <p>财务管理创造价值</p>
  </div>
  <div class="field"><label>账号</label><input id="u" autocomplete="username" placeholder="请输入账号"></div>
  <div class="field"><label>密码</label>
    <div class="pwd-wrap">
      <input id="p" type="password" autocomplete="current-password" placeholder="请输入密码">
      <button type="button" class="pwd-eye" id="pwdEye" onclick="toggleEye()" title="显示密码" aria-label="显示密码">👁</button>
    </div>
  </div>
  <button id="btn">登 录</button>
  <div class="msg" id="msg"></div>
  <div class="lock-box" id="lockBox" hidden></div>
  <div class="hint">账号由管理员分配，权限范围以账号配置为准</div>
</div>
<script>
const u=document.getElementById('u'),p=document.getElementById('p'),btn=document.getElementById('btn'),
      msg=document.getElementById('msg'),lockBox=document.getElementById('lockBox'),eye=document.getElementById('pwdEye');
function show(m,ok){msg.textContent=m;msg.style.color=ok?'#0f9d6e':'#d63c3c'}

// —— 密码小眼睛：切换显示 / 隐藏 ——
function toggleEye(){
  const willShow=p.type==='password';
  p.type=willShow?'text':'password';
  eye.textContent=willShow?'🙈':'👁';
  eye.classList.toggle('on',willShow);
  eye.title=willShow?'隐藏密码':'显示密码';
  eye.setAttribute('aria-label',eye.title);
}

// —— 锁定提示：冷却期显示剩余秒数倒计时；永久锁定提示找管理员 ——
let lockTimer=null, lockPoll=null;
function clearLockTimers(){
  if(lockTimer){clearInterval(lockTimer);lockTimer=null;}
  if(lockPoll){clearInterval(lockPoll);lockPoll=null;}
}
function renderLock(state){
  clearLockTimers();
  if(!state||!state.blocked){lockBox.hidden=true;lockBox.innerHTML='';btn.disabled=false;return;}
  const permanently=state.retry_after<=0;
  lockBox.hidden=false;
  lockBox.className='lock-box'+(permanently?' err':'');
  if(permanently){
    lockBox.innerHTML='🔒 密码错误次数过多，账号已锁定，请联系管理员重置密码。';
    btn.disabled=true;
    // 永久锁定也要轮询：管理员重置后提示应自动消失
    lockPoll=setInterval(pollLockState,5000);
    return;
  }
  btn.disabled=true;
  let left=state.retry_after;
  const tick=()=>{
    if(left<=0){
      // 冷却结束：重新查一次真实状态（管理员可能已重置，也可能已被锁定）
      pollLockState(true);
      return;
    }
    lockBox.innerHTML='⏳ 密码错误次数过多，请在 <b>'+left+'</b> 秒后再试。';
    left--;
  };
  tick();
  lockTimer=setInterval(tick,1000);
  lockPoll=setInterval(()=>pollLockState(false),5000);
}
// 轮询账号的锁定状态：管理员重置后，登录页提示自动消失、按钮恢复
async function pollLockState(isTickEnd){
  const name=u.value.trim();
  if(!name)return;
  try{
    const r=await fetch('/api/login/lock-status?username='+encodeURIComponent(name));
    const s=await r.json();
    if(!s.blocked){
      renderLock({blocked:false});
      if(isTickEnd)show('现在可以重新尝试登录');
    }else if(s.retry_after<=0){
      renderLock(s);   // 已被永久锁定
    }
  }catch(e){}
}
// 账号输入变化时查询锁定状态
let lockCheckTimer=null;
u.addEventListener('input',()=>{
  clearTimeout(lockCheckTimer);
  const name=u.value.trim();
  if(!name){renderLock({blocked:false});return;}
  lockCheckTimer=setTimeout(async()=>{
    try{
      const r=await fetch('/api/login/lock-status?username='+encodeURIComponent(name));
      renderLock(await r.json());
    }catch(e){}
  },300);
});

async function doLogin(){
  if(!u.value.trim()||!p.value){show('请输入账号和密码');return}
  btn.disabled=true;btn.textContent='登录中...';msg.textContent='';
  try{
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({username:u.value.trim(),password:p.value})});
    const d=await r.json();
    if(!r.ok){
      show(d.detail||'登录失败');
      // 单点登录（#113）：账号已在线 → 弹出提示框（用户要求文案）
      if(r.status===409){alert(d.detail||'该账号当前已在线。如非本人操作，请联系超级管理员将该用户强制下线后再试');}
      // 失败后刷新锁定状态（可能进入冷却或被锁定）
      try{
        const s2=await fetch('/api/login/lock-status?username='+encodeURIComponent(u.value.trim()));
        renderLock(await s2.json());
      }catch(e){}
      return;
    }
    renderLock({blocked:false});
    // #114：写会话级 cookie（不带过期时间）——浏览器关闭即失效，重开必重登
    document.cookie='tk='+encodeURIComponent(d.token)+'; path=/; SameSite=Lax';
    localStorage.removeItem('tk');
    location.href='/';
  }catch(e){show('网络错误，请重试')}
  finally{btn.disabled=false;btn.textContent='登 录'}
}
btn.onclick=doLogin;
p.addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});
</script>
</body>
</html>
